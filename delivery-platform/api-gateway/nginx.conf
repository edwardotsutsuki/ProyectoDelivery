events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting para protección de APIs y fuerza bruta en autenticación
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend_core_upstream {
        server backend-core:3000;
    }

    upstream tracking_service_upstream {
        server tracking-service:4000;
    }

    upstream osrm_backend_upstream {
        server osrm-backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx-delivery","osrm":"connected"}';
        }

        # Rate limiting reforzado para endpoints de autenticación y login
        location ~* ^/api/(v1/)?auth/ {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://backend_core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Proxy general hacia Backend Core
        location /api/ {
            limit_req zone=api_general_limit burst=60 nodelay;
            proxy_pass http://backend_core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Proxy hacia el motor de ruteo OSRM (Baba, Babahoyo y Montalvo)
        location /osrm/ {
            limit_req zone=api_general_limit burst=60 nodelay;
            proxy_pass http://osrm_backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30;
        }

        # Proxy WebSockets hacia Servicio de Tracking (soporta /ws y /ws/)
        location /ws {
            proxy_pass http://tracking_service_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
